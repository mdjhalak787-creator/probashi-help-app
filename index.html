<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইরাক প্রবাসী হেল্প</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #0b132b; color: #ffffff; padding-bottom: 70px; }
        .header { background: #1c2541; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3a506b; }
        .header h2 { font-size: 18px; color: #4cc9f0; }
        .user-card { background: #1c2541; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .user-title { font-size: 16px; font-weight: 600; color: #f77f00; margin-bottom: 5px; }
        .user-status { font-size: 13px; color: #8d99ae; margin-bottom: 12px; }
        .stats-row { display: flex; gap: 10px; }
        .stat-box { background: #0b132b; padding: 10px; border-radius: 8px; text-align: center; flex: 1; border: 1px solid #28385e; }
        .stat-box span { display: block; font-size: 12px; color: #8d99ae; }
        .stat-box b { font-size: 15px; color: #4cc9f0; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0b132b; border-top: 1px solid #1c2541; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { text-align: center; color: #8d99ae; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: #4cc9f0; }
        .nav-item img { width: 22px; height: 22px; display: block; margin: 0 auto 3px; filter: grayscale(100%); }
        .nav-item.active img { filter: brightness(0) saturate(100%) invert(71%) sepia(37%) saturate(1475%) hue-rotate(160deg) brightness(98%) contrast(96%); }
    </style>
</head>
<body>
    <div class="header">
        <h2>🇮🇶 ইরাক প্রবাসী হেল্প</h2>
    </div>
    <div class="user-card">
        <div class="user-title">Md Zalak Mia</div>
        <div class="user-status">baghdad, Iraq</div>
        <div class="stats-row">
            <div class="stat-box">
                <span>স্ট্যাটাস</span>
                <b>সক্রিয়</b>
            </div>
        </div>
    </div>
    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item active"><img src="https://img.icons8.com/ios-filled/50/home.png" alt="Home">হোম</a>
        <a href="social.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/conference.png" alt="Social">সোশ্যাল</a>
        <a href="jobs.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/briefcase.png" alt="Jobs">চাকরি</a>
        <a href="notice.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/appointment-reminders.png" alt="Notice">নোটিশ</a>
        <a href="passport-status.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/passport.png" alt="Passport">পাসপোর্ট</a>
        <a href="track.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/map-pin.png" alt="Track">ট্রেক</a>
        <a href="chat-support.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/chat.png" alt="Support">সাপোর্ট</a>
        <a href="profile.html" class="nav-item"><img src="https://img.icons8.com/ios-filled/50/user.png" alt="Profile">প্রোফাইল</a>
    </div>
</body>
</html>
